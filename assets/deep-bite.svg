<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 144 144" width="144" height="144" role="img" aria-label="Deep Bite">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1e9ad0"/>
      <stop offset="0.5" stop-color="#0b5f8e"/>
      <stop offset="1" stop-color="#041a33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#bfefff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#bfefff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000a1e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000a1e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="144" height="144" rx="32"/></clipPath>
  </defs>
  <rect width="144" height="144" rx="32" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <rect width="144" height="144" fill="url(#glow)"/>
    <polygon points="58,-10 84,-10 128,150 96,150" fill="url(#ray)"/>
    <polygon points="98,-10 112,-10 160,120 140,120" fill="url(#ray)" opacity="0.7"/>
    <!-- seabed hint -->
    <path d="M-4 150 L-4 128 Q22 116 44 128 Q66 112 88 126 Q112 110 134 124 Q146 120 150 126 L150 150 Z" fill="#02101f" opacity="0.55"/>
    <!-- plankton -->
    <circle cx="26" cy="100" r="5" fill="#4fd8ff" opacity="0.18"/><circle cx="26" cy="100" r="2.4" fill="#9ff0ff" opacity="0.95"/>
    <circle cx="120" cy="38" r="4.5" fill="#4fd8ff" opacity="0.18"/><circle cx="120" cy="38" r="2" fill="#9ff0ff" opacity="0.9"/>
    <circle cx="104" cy="118" r="4" fill="#ffe08a" opacity="0.2"/><circle cx="104" cy="118" r="1.8" fill="#ffe9a8" opacity="0.9"/>
    <circle cx="40" cy="34" r="3.5" fill="#ffe08a" opacity="0.18"/><circle cx="40" cy="34" r="1.5" fill="#ffe9a8" opacity="0.85"/>
    <!-- bubbles -->
    <circle cx="116" cy="74" r="4" fill="none" stroke="#cfefff" stroke-width="1.3" opacity="0.6"/>
    <circle cx="124" cy="60" r="2.4" fill="none" stroke="#cfefff" stroke-width="1.1" opacity="0.5"/>
    <circle cx="121" cy="50" r="1.5" fill="none" stroke="#cfefff" stroke-width="1" opacity="0.45"/>
    <!-- fish shadow + hero fish (rendered with the game's own art) -->
    <ellipse cx="75" cy="119" rx="47" ry="9" fill="url(#shadow)"/>
    <image x="13.00" y="39.34" width="120.00" height="75.31" xlink:href="data:image/png;base64,"/>
  </g>
</svg>
