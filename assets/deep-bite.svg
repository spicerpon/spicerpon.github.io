<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 144 144" width="144" height="144" role="img" aria-label="Deep Bite">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3cc4f2"/>
      <stop offset="0.48" stop-color="#1389c9"/>
      <stop offset="1" stop-color="#0c4f92"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.3" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#d9f6ff" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#d9f6ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#d9f6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.72">
      <stop offset="0.6" stop-color="#062a5c" stop-opacity="0"/>
      <stop offset="1" stop-color="#062a5c" stop-opacity="0.42"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#042452" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#042452" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="144" height="144" rx="32"/></clipPath>
  </defs>
  <rect width="144" height="144" rx="32" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <rect width="144" height="144" fill="url(#sun)"/>
    <!-- god rays -->
    <polygon points="52,-10 76,-10 118,150 86,150" fill="url(#ray)"/>
    <polygon points="94,-10 108,-10 154,112 136,112" fill="url(#ray)" opacity="0.7"/>
    <polygon points="8,-10 20,-10 42,110 26,110" fill="url(#ray)" opacity="0.45"/>
    <!-- soft caustic patches -->
    <ellipse cx="38" cy="26" rx="22" ry="9" fill="#ffffff" opacity="0.07" transform="rotate(-18 38 26)"/>
    <ellipse cx="104" cy="20" rx="26" ry="8" fill="#ffffff" opacity="0.06" transform="rotate(14 104 20)"/>
    <ellipse cx="72" cy="128" rx="40" ry="8" fill="#ffffff" opacity="0.045"/>
    <rect width="144" height="144" fill="url(#vig)"/>
    <!-- plankton glows -->
    <circle cx="24" cy="110" r="5" fill="#7fe9ff" opacity="0.18"/><circle cx="24" cy="110" r="2.2" fill="#c8f6ff" opacity="0.95"/>
    <circle cx="124" cy="34" r="4.5" fill="#7fe9ff" opacity="0.18"/><circle cx="124" cy="34" r="2" fill="#c8f6ff" opacity="0.9"/>
    <circle cx="116" cy="118" r="4" fill="#ffe08a" opacity="0.22"/><circle cx="116" cy="118" r="1.8" fill="#fff1bf" opacity="0.95"/>
    <circle cx="30" cy="44" r="3.5" fill="#ffe08a" opacity="0.18"/><circle cx="30" cy="44" r="1.5" fill="#fff1bf" opacity="0.9"/>
    <!-- bubbles -->
    <circle cx="121" cy="62" r="4" fill="none" stroke="#e4f7ff" stroke-width="1.3" opacity="0.6"/>
    <circle cx="128" cy="50" r="2.4" fill="none" stroke="#e4f7ff" stroke-width="1.1" opacity="0.5"/>
    <circle cx="126" cy="41" r="1.4" fill="none" stroke="#e4f7ff" stroke-width="1" opacity="0.45"/>
    <!-- hero fish (rendered with the game's own art) -->
    <ellipse cx="75" cy="113" rx="48" ry="7" fill="url(#shadow)"/>
    <image x="8.50" y="34.33" width="125.00" height="78.34" xlink:href="data:image/png;base64,"/>
    <!-- glass top gloss + inner edge -->
    <rect x="0" y="0" width="144" height="60" fill="url(#gloss)"/>
    <rect x="1" y="1" width="142" height="142" rx="31" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
  </g>
</svg>
